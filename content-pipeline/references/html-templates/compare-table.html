<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:675px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FAFBFC; padding:45px 50px; }
h2 { font-size:26px; color:#333; margin-bottom:25px; text-align:center; }
table { width:100%; border-collapse:separate; border-spacing:0; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
th { background:#4A90E2; color:#fff; padding:14px 16px; font-size:15px; text-align:left; }
td { padding:13px 16px; font-size:14px; color:#333; border-top:1px solid #EEE; line-height:1.6; }
tr:nth-child(even) td { background:#F8FAFD; }
.tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:bold; }
.tag-blue { background:#E3F0FF; color:#4A90E2; }
.tag-green { background:#E8F8E0; color:#5CB800; }
.tag-orange { background:#FFF3E0; color:#E8853A; }
</style></head><body>
<h2>三种任务模式，什么时候用哪个</h2>
<table>
<tr><th style="width:18%;">模式</th><th style="width:25%;">适合什么任务</th><th style="width:30%;">怎么工作</th><th style="width:27%;">典型场景</th></tr>
<tr><td><span class="tag tag-blue">普通模式</span></td><td>简单、一次性任务</td><td>直接做，做完给你</td><td>润色段落、翻译文章、格式转换</td></tr>
<tr><td><span class="tag tag-green">目标模式</span></td><td>有明确验收标准的复杂任务</td><td>做完后逐项自检，不达标自动返工</td><td>行业报告、数据整理、周报、方案撰写</td></tr>
<tr><td><span class="tag tag-orange">计划模式</span></td><td>长程、步骤多、需求模糊</td><td>先出可编辑的计划，你确认后才执行</td><td>季度营销方案、大型调研、产品规划</td></tr>
</table>
<p style="text-align:center; margin-top:25px; font-size:15px; color:#666;">简单记：<b style="color:#4A90E2;">简单任务用普通</b> · <b style="color:#5CB800;">标准明确用目标</b> · <b style="color:#E8853A;">方向模糊用计划</b></p>
</body></html>
