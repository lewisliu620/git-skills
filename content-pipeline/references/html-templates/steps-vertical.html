<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:675px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FAFBFC; padding:45px 50px; }
h2 { font-size:26px; color:#333; margin-bottom:30px; text-align:center; }
.steps { display:flex; flex-direction:column; gap:14px; max-width:900px; margin:0 auto; }
.step-row { display:flex; align-items:flex-start; gap:16px; background:#fff; border-radius:10px; padding:16px 20px; border-left:4px solid #4A90E2; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
.step-row .n { width:36px; height:36px; background:#4A90E2; color:#fff; border-radius:50%; text-align:center; line-height:36px; font-weight:bold; font-size:16px; flex-shrink:0; }
.step-row .body h3 { font-size:16px; color:#333; margin-bottom:4px; }
.step-row .body p { font-size:14px; color:#666; line-height:1.6; }
.step-row.highlight { border-left-color:#7ED321; background:#F8FEF4; }
.step-row.highlight .n { background:#7ED321; }
</style></head><body>
<h2>实战：用目标模式做周报，5 步跑通</h2>
<div class="steps">
  <div class="step-row"><div class="n">1</div><div class="body"><h3>切换到目标模式</h3><p>打开豆包工作，新建工作任务，在输入区域切换到"目标模式"</p></div></div>
  <div class="step-row"><div class="n">2</div><div class="body"><h3>上传素材</h3><p>把这周的聊天记录、飞书文档、任务清单截图传上去</p></div></div>
  <div class="step-row"><div class="n">3</div><div class="body"><h3>写清楚任务 + 验收标准</h3><p>"按项目分类；每项目写进展/卡点/下周计划；进展要有具体数字；不超过800字；正式但不官腔"</p></div></div>
  <div class="step-row"><div class="n">4</div><div class="body"><h3>让 AI 跑</h3><p>它整理素材、按项目分类、写内容，然后逐条自检：分类对了吗？有数字吗？字数超了吗？</p></div></div>
  <div class="step-row highlight"><div class="n">✓</div><div class="body"><h3>拿到达标版本</h3><p>发现哪个项目没数字？自动回去补。你拿到的是逐条达标的周报，不是"看起来像周报"的东西</p></div></div>
</div>
</body></html>
