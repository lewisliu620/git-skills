<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:675px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FAFBFC; padding:50px 60px; }
h2 { font-size:26px; color:#333; margin-bottom:40px; text-align:center; }
.cards { display:flex; gap:24px; justify-content:center; }
.card { flex:1; max-width:320px; background:#fff; border-radius:14px; padding:28px 24px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.06); border-top:4px solid #4A90E2; }
.card .icon { font-size:40px; margin-bottom:14px; }
.card .step-label { font-size:13px; color:#4A90E2; font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.card h3 { font-size:18px; color:#333; margin-bottom:10px; }
.card p { font-size:14px; color:#666; line-height:1.6; }
.card:nth-child(2) { border-top-color:#7ED321; }
.card:nth-child(2) .step-label { color:#5CB800; }
.card:nth-child(3) { border-top-color:#FF6B6B; }
.card:nth-child(3) .step-label { color:#FF6B6B; }
.tip { margin-top:35px; background:#FFF8E1; border-radius:10px; padding:16px 24px; text-align:center; font-size:15px; color:#B8860B; }
.tip b { color:#E8853A; }
</style></head><body>
<h2>3 步上手目标模式</h2>
<div class="cards">
  <div class="card"><div class="icon">⬆️</div><div class="step-label">STEP 1</div><h3>更新到最新版</h3><p>目标模式 9月23日刚全量上线桌面端，更新到最新版本就能看到</p></div>
  <div class="card"><div class="icon">🎯</div><div class="step-label">STEP 2</div><h3>切到目标模式</h3><p>新建工作任务，在输入区域找到模式切换，选"目标模式"</p></div>
  <div class="card"><div class="icon">📝</div><div class="step-label">STEP 3</div><h3>写清任务+标准</h3><p>关键是验收标准要具体可检查，别写"写好一点"，要写"数据必须最新""覆盖5家竞品"</p></div>
</div>
<div class="tip">💡 第一次用建议从简单任务开始：整理周报、整理会议纪要，熟悉了再上复杂任务</div>
</body></html>
